const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function toThaiDate(value) {
  if (!value) return '-';
  if (typeof value === 'string' && /[ก-๙]/.test(value)) return value;
  const d = typeof value === 'string' ? new Date(value) : value;
  if (isNaN(d)) return '-';
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
}
function maskNid(nid) {
  if (!nid) return '-';
  const n = String(nid).replace(/\D/g, '');
  if (n.length !== 13) return nid;
  return `${n[0]}-${n.slice(1,5)}-XXXXX-${n.slice(10,12)}-${n[12]}`;
}
function adlGroup(adl) {
  const n = Number(adl);
  if (isNaN(n)) return 'ติดสังคม';
  if (n <= 4) return 'ติดเตียง';
  if (n <= 11) return 'ติดบ้าน';
  return 'ติดสังคม';
}

function normalizeElderly(id, d) {
  const adl = d.adl !== undefined && d.adl !== '' ? Number(d.adl) : null;
  return {
    id,
    hn: d.hn || ('HN-' + String(id).slice(-5).toUpperCase()),
    nationalId: d.nationalId || maskNid(d.nid),
    name: d.name || '-',
    age: d.age || '-',
    gender: d.gender || '-',
    village: d.village || d.address || '-',
    adl: adl !== null ? adl : '-',
    group: d.group || d.type || (adl !== null ? adlGroup(adl) : 'ติดสังคม'),
    diseases: d.diseases || d.disease || 'ไม่มี',
    allergies: d.allergies || 'ไม่มี',
    cm: d.cm || '-',
    cg: d.cg || d.caregiver || '-',
    caregiverName: d.caregiverName || d.caregiver || '-',
    phone: d.phone || '-',
    lastVisit: d.lastVisit || '-',
    nextVisit: d.nextVisit || '-',
    visitStatus: d.visitStatus || 'รอเยี่ยม',
    urgency: d.urgency || 'ปกติ',
    photoUrl: d.photoUrl || '',
    note: d.note || '',
    _raw: d,
  };
}

const elderlyService = {
  subscribe(cb, onError) {
    if (!firebaseReady) { cb(mockElderly, 'mock'); return () => {}; }
    return db.collection('patients').onSnapshot(
      snap => {
        const list = snap.docs.map(d => normalizeElderly(d.id, d.data()));
        cb(list.length ? list : mockElderly, list.length ? 'firestore' : 'mock');
      },
      err => { onError && onError(err); cb(mockElderly, 'mock'); }
    );
  },
  create: (data) => db.collection('patients').add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() }),
  update: (id, data) => db.collection('patients').doc(id).update({ ...data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }),
  remove: async (id) => {
    const rel = await db.collection('visits').where('patientId','==',id).get();
    const batch = db.batch();
    rel.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('patients').doc(id));
    return batch.commit();
  },
};

const visitService = {
  subscribe(cb, onError) {
    if (!firebaseReady) { cb(mockVisits, 'mock'); return () => {}; }

const uploadService = {
  async toImgBB(file, onProgress) {
    onProgress && onProgress('uploading');
    const fd = new FormData();
    fd.append('image', file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:'POST', body:fd });
    const json = await res.json();
    if (!json.success) throw new Error(json.error?.message || 'อัปโหลดรูปภาพไม่สำเร็จ');
    onProgress && onProgress('done');
    return { url: json.data.url, thumb: json.data.thumb?.url || json.data.url, deleteUrl: json.data.delete_url };
  },
};

   components/Icon.jsx  —  Lucide wrapper

function camelAttrs(attrs) {
  const out = {};
  Object.keys(attrs || {}).forEach(k => {
    const key = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[key === 'class' ? 'className' : key] = attrs[k];
  });
  return out;
}
function Icon({ name, className = 'w-5 h-5', strokeWidth = 2 }) {
  const node = (window.lucide && (lucide.icons?.[name] || lucide[name])) || null;
  if (!node || !Array.isArray(node)) return <span className={className} />;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {node.map(([tag, attrs], i) => React.createElement(tag, { key:i, ...camelAttrs(attrs) }))}
    </svg>
  );
}

      {children}

        {items.map(t => (

function DataProvider({ children }) {

  const [visits, setVisits] = useState([]);
  const [loading, setLoading] = useState(true);
  const [source, setSource] = useState('loading');

  useEffect(() => {
    let unsub1 = () => {}, unsub2 = () => {};
    unsub1 = elderlyService.subscribe((list, src) => { setElderly(list); setSource(src); setLoading(false); },
      () => setSource('offline'));
    unsub2 = visitService.subscribe((list) => setVisits(list), () => {});
    const timer = setTimeout(() => setLoading(false), 4000);
    return () => { unsub1 && unsub1(); unsub2 && unsub2(); clearTimeout(timer); };
  }, []);

  const stats = useMemo(() => {
    if (!elderly.length) return mockDashboard;
    const bed  = elderly.filter(e => e.group === 'ติดเตียง').length;
    const home = elderly.filter(e => e.group === 'ติดบ้าน').length;
    const monthKey = String(new Date().getFullYear() + 543);
    return {
      totalElderly: elderly.length,
      homebound: home,
      bedridden: bed,
      cmCount: mockCM.length,
      cgCount: mockCG.length,
      visited: visits.length || mockDashboard.visited,
      target: mockDashboard.target,
      pending: elderly.filter(e => e.visitStatus === 'รอเยี่ยม').length,
      urgent: elderly.filter(e => e.urgency === 'เร่งด่วน').length,
    };
  }, [elderly, visits]);

  const pieData = useMemo(() => {
    const g = { 'ติดสังคม':0, 'ติดบ้าน':0, 'ติดเตียง':0 };
    elderly.forEach(e => { if (g[e.group] !== undefined) g[e.group]++; });

      { name:'ติดบ้าน',  value:g['ติดบ้าน'],  color:'#F59E0B' },
      { name:'ติดเตียง', value:g['ติดเตียง'], color:'#DC2626' },
    ];
  }, [elderly]);

  return (
    <DataCtx.Provider value={{ elderly, visits, loading, source, stats, pieData }}>
      {children}
    </DataCtx.Provider>
  );
}

  );
}

function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

   pages/VisitRecord.jsx  —  Stepper 5 ขั้นตอน
   ========================================================================= */
const STEPS = ['เลือกผู้สูงอายุ','รายละเอียดการเยี่ยม','ประเมินสุขภาพ','แผนการดูแล','หลักฐานและยืนยัน'];

function VisitRecord() {
  const { elderly, visits, loading } = useData();
  const { showToast } = useToast();
  const loc = useLocation();
  const [step, setStep] = useState(0);
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({
    date:new Date().toISOString().slice(0,10), time:'', visitType:'เยี่ยมบ้าน', visitor:'', visitorRole:'CG', companion:'', presence:'พบ',
    adl:'', bp:'', pulse:'', weight:'', sugar:'', wound:'ไม่มี', diet:'รับประทานได้ปกติ', excretion:'ปกติ', medication:'รับประทานยาครบตามแผน', mental:'อารมณ์แจ่มใส', problem:'',
    activities:'', advice:'', carePlan:'', nextDate:'', urgency:'ปกติ',
    photoUrl:'', note:'', confirm:false,
  });

  useEffect(() => {
    const id = new URLSearchParams(loc.search).get('id');
    if (id && elderly.length) {
      const found = elderly.find(e => String(e.id) === id);
      if (found) { setSelected(found); setForm(f => ({...f, adl:found.adl !== '-' ? found.adl : '', visitor:found.cg !== '-' ? found.cg : ''})); }
    }
  }, [loc.search, elderly]);

  const up = (k,v) => setForm(f => ({...f,[k]:v}));
  const filtered = useMemo(() => elderly.filter(e =>
    !search || e.name.includes(search) || String(e.hn).includes(search) || e.village.includes(search) || String(e.nationalId).includes(search)
  ), [elderly, search]);

  const next = () => {
    if (step === 0 && !selected) return showToast('กรุณาเลือกผู้สูงอายุก่อนดำเนินการต่อ', 'error');
    if (step === 1 && !form.date) return showToast('กรุณาระบุวันที่เยี่ยม', 'error');
    setStep(s => Math.min(s+1, 4));
  };

  const save = async (draft) => {
    if (!draft && !form.confirm) return showToast('กรุณายืนยันความถูกต้องของข้อมูลก่อนส่งให้ CM ตรวจสอบ', 'error');
    setSaving(true);
    try {
      const payload = {
        patientId: selected.id, patientName: selected.name, village: selected.village,
        date: form.date, time: form.time, visitType: form.visitType, visitor: form.visitor, visitorRole: form.visitorRole,
        companion: form.companion, presence: form.presence,
        adl: form.adl, bp: form.bp, pulse: form.pulse, weight: form.weight, sugar: form.sugar, wound: form.wound,
        diet: form.diet, excretion: form.excretion, medication: form.medication, mental: form.mental, problem: form.problem,
        activities: form.activities, advice: form.advice, plan: form.carePlan, nextdate: form.nextDate, urgency: form.urgency,
        photoUrl: form.photoUrl, note: form.note,
        status: draft ? 'ร่าง' : 'รอ CM ตรวจสอบ',
      };
      if (firebaseReady) await visitService.create(payload);
      showToast(draft ? 'บันทึกร่างเรียบร้อยแล้ว' : 'บันทึกและส่งให้ CM ตรวจสอบเรียบร้อยแล้ว');
      if (!draft) { setStep(0); setSelected(null); setForm(f => ({...f, problem:'', activities:'', advice:'', carePlan:'', photoUrl:'', note:'', confirm:false})); }
    } catch (err) { showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error'); }
    finally { setSaving(false); }
  };

  const recentCols = [
    { key:'dateLabel', header:'วันที่เยี่ยม', render:r => toThaiDate(r.date) },
    { key:'patientName', header:'ผู้สูงอายุ' },
    { key:'visitType', header:'รูปแบบ' },
    { key:'visitor', header:'ผู้เยี่ยม' },
    { key:'problem', header:'ปัญหาที่พบ', render:r => <span className="max-w-[260px] truncate inline-block">{r.problem || '-'}</span> },
    { key:'urgency', header:'ความเร่งด่วน', render:r => <StatusBadge label={r.urgency || 'ปกติ'} /> },
  ];

  return (
    <div className="space-y-5">
      <Card bodyClass="pt-5">
        <div className="flex items-start overflow-x-auto pb-1">
          {STEPS.map((label,i) => (
            <div key={label} className="flex items-center flex-1 min-w-[110px]">
              <div className="flex flex-col items-center flex-1">
                <button onClick={()=>i<step && setStep(i)} className={`w-9 h-9 rounded-full flex items-center justify-center text-sm font-semibold transition-all ${i<step ? 'bg-primary text-white' : i===step ? 'bg-primary text-white ring-4 ring-teal-100' : 'bg-slate-100 text-slate-400'}`}>
                  {i<step ? <Icon name="Check" className="w-4 h-4" /> : i+1}
                </button>
                <p className={`text-[11px] mt-2 text-center px-1 ${i===step ? 'text-primary font-semibold' : 'text-slate-400'}`}>{label}</p>
              </div>
              {i < STEPS.length-1 && <div className={`h-0.5 flex-1 mx-1 mt-[-22px] ${i<step ? 'bg-primary' : 'bg-slate-200'}`} />}
            </div>
          ))}
        </div>
      </Card>

      {step === 0 && (
        <Card title="ขั้นตอนที่ 1: เลือกผู้สูงอายุ" subtitle="ค้นหาด้วยชื่อ, เลขบัตรประชาชน, HN หรือหมู่บ้าน">
          <div className="relative mb-4">
            <Icon name="Search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="พิมพ์เพื่อค้นหา เช่น บุญมี, HN-00231, หมู่ 1" className="input pl-9" />
          </div>
          {loading ? <p className="text-sm text-slate-400 py-6 text-center">กำลังโหลดรายชื่อ...</p> : (
            <div className="grid sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto mb-4">
              {filtered.map(e => (
                <button key={e.id} onClick={()=>{setSelected(e); setForm(f=>({...f, adl:e.adl!=='-'?e.adl:'', visitor:e.cg!=='-'?e.cg:''}));}}
                  className={`text-left p-3 rounded-xl border transition-all ${selected?.id===e.id ? 'border-primary bg-teal-50 ring-2 ring-primary/20' : 'border-slate-200 hover:border-primary/40 hover:bg-slate-50'}`}>
                  <div className="flex items-center gap-3">
                    {e.photoUrl ? <img src={e.photoUrl} className="w-10 h-10 rounded-full object-cover" /> : <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><Icon name="User" className="w-5 h-5 text-slate-300" /></div>}
                    <div className="min-w-0">
                      <p className="font-medium text-slate-800 truncate">{e.name}</p>
                      <p className="text-[11px] text-slate-500 truncate">{e.hn} · {e.village} · ADL {e.adl}</p>
                    </div>
                  </div>
                </button>
              ))}
              {filtered.length === 0 && <p className="text-sm text-slate-400 col-span-2 text-center py-6">ไม่พบผู้สูงอายุที่ค้นหา</p>}
            </div>
          )}
          {selected && (
            <div className="bg-teal-50 border border-teal-100 rounded-xl p-4">
              <p className="text-xs font-semibold text-primary mb-3">ข้อมูลสรุปผู้สูงอายุที่เลือก</p>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                <Info label="ชื่อผู้สูงอายุ" value={selected.name} />
                <Info label="อายุ" value={`${selected.age} ปี`} />
                <Info label="หมู่บ้าน" value={selected.village} />
                <Info label="ระดับ ADL" value={`${selected.adl} (${selected.group})`} />
                <Info label="โรคประจำตัว" value={selected.diseases} />
                <Info label="ประวัติแพ้ยา" value={selected.allergies} danger={selected.allergies!=='ไม่มี'} />
                <Info label="CM ผู้รับผิดชอบ" value={selected.cm} />
                <Info label="CG ผู้รับผิดชอบ" value={selected.cg} />
              </div>
            </div>
          )}
        </Card>
      )}

      {step === 1 && (
        <Card title="ขั้นตอนที่ 2: รายละเอียดการเยี่ยม">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <Field label="วันที่เยี่ยม *"><input type="date" value={form.date} onChange={e=>up('date',e.target.value)} className="input" /></Field>
            <Field label="เวลาเยี่ยม"><input type="time" value={form.time} onChange={e=>up('time',e.target.value)} className="input" /></Field>
            <Field label="รูปแบบการเยี่ยม">
              <select value={form.visitType} onChange={e=>up('visitType',e.target.value)} className="input">
                <option>เยี่ยมบ้าน</option><option>โทรติดตาม</option><option>Telehealth</option>
              </select>
            </Field>
            <Field label="ประเภทผู้เยี่ยม">
              <select value={form.visitorRole} onChange={e=>up('visitorRole',e.target.value)} className="input">
                <option value="CM">Care Manager (CM)</option><option value="CG">Caregiver (CG)</option><option value="STAFF">เจ้าหน้าที่ รพ.สต.</option>
              </select>
            </Field>
            <Field label="ชื่อผู้เยี่ยม"><input value={form.visitor} onChange={e=>up('visitor',e.target.value)} placeholder="เช่น นางสมหญิง ทองดี" className="input" /></Field>
            <Field label="ผู้ร่วมเยี่ยม"><input value={form.companion} onChange={e=>up('companion',e.target.value)} placeholder="เช่น อสม.ประจำหมู่บ้าน" className="input" /></Field>
            <Field label="สถานะการพบผู้รับบริการ" className="md:col-span-2">
              <div className="flex flex-wrap gap-2">
                {['พบ','ไม่พบ','ย้ายที่อยู่','เสียชีวิต'].map(s => (
                  <button key={s} type="button" onClick={()=>up('presence',s)}
                    className={`px-4 py-2.5 rounded-lg text-sm border transition-colors ${form.presence===s ? 'bg-primary text-white border-primary' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{s}</button>
                ))}
              </div>
            </Field>
          </div>
        </Card>
      )}

      {step === 2 && (
        <Card title="ขั้นตอนที่ 3: การประเมินสุขภาพ">
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
            <Field label="คะแนน ADL (0-20)"><input type="number" min="0" max="20" value={form.adl} onChange={e=>up('adl',e.target.value)} className="input" /></Field>
            <Field label="ความดันโลหิต (mmHg)"><input value={form.bp} onChange={e=>up('bp',e.target.value)} placeholder="120/80" className="input" /></Field>
            <Field label="ชีพจร (ครั้ง/นาที)"><input type="number" value={form.pulse} onChange={e=>up('pulse',e.target.value)} className="input" /></Field>
            <Field label="น้ำหนัก (กก.)"><input type="number" step="0.1" value={form.weight} onChange={e=>up('weight',e.target.value)} className="input" /></Field>
            <Field label="น้ำตาลในเลือด (mg/dL)"><input type="number" value={form.sugar} onChange={e=>up('sugar',e.target.value)} className="input" /></Field>
            <Field label="สภาพแผลกดทับ">
              <select value={form.wound} onChange={e=>up('wound',e.target.value)} className="input">
                <option>ไม่มี</option><option>ระดับ 1</option><option>ระดับ 2</option><option>ระดับ 3</option><option>ระดับ 4</option>
              </select>
            </Field>
            <Field label="การรับประทานอาหาร"><input value={form.diet} onChange={e=>up('diet',e.target.value)} className="input" /></Field>
            <Field label="การขับถ่าย"><input value={form.excretion} onChange={e=>up('excretion',e.target.value)} className="input" /></Field>
            <Field label="การใช้ยา"><input value={form.medication} onChange={e=>up('medication',e.target.value)} className="input" /></Field>
            <Field label="อารมณ์และสุขภาพจิต" className="col-span-2 md:col-span-3"><input value={form.mental} onChange={e=>up('mental',e.target.value)} className="input" /></Field>
          </div>
          {form.adl !== '' && <p className="text-xs text-slate-500 mt-3">ระบบประเมินเบื้องต้น: คะแนน ADL {form.adl} จัดอยู่ในกลุ่ม <b className="text-primary">{adlGroup(form.adl)}</b></p>}
          <Field label="ปัญหา/อาการที่พบ" className="mt-4"><textarea rows={3} value={form.problem} onChange={e=>up('problem',e.target.value)} className="input" placeholder="เช่น พบแผลกดทับระดับ 2 บริเวณสะโพกด้านขวา" /></Field>
        </Card>
      )}

      {step === 3 && (
        <Card title="ขั้นตอนที่ 4: การดูแลและแผนติดตาม">
          <div className="space-y-4">
            <Field label="กิจกรรม/หัตถการที่ให้บริการ"><textarea rows={2} value={form.activities} onChange={e=>up('activities',e.target.value)} className="input" placeholder="เช่น ทำแผลกดทับ, วัดสัญญาณชีพ, ฟื้นฟูสมรรถภาพ" /></Field>
            <Field label="คำแนะนำแก่ผู้สูงอายุ/ญาติ"><textarea rows={2} value={form.advice} onChange={e=>up('advice',e.target.value)} className="input" placeholder="เช่น แนะนำพลิกตะแคงตัวทุก 2 ชั่วโมง" /></Field>
            <Field label="แผนดูแลต่อเนื่อง (Care Plan)"><textarea rows={2} value={form.carePlan} onChange={e=>up('carePlan',e.target.value)} className="input" /></Field>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <Field label="วันที่นัดเยี่ยมครั้งถัดไป"><input type="date" value={form.nextDate} onChange={e=>up('nextDate',e.target.value)} className="input" /></Field>
              <Field label="ระดับความเร่งด่วน">
                <div className="flex gap-2">
                  {[{v:'ปกติ',c:'emerald'},{v:'ติดตาม',c:'amber'},{v:'เร่งด่วน',c:'red'}].map(o => (
                    <button key={o.v} type="button" onClick={()=>up('urgency',o.v)}
                      className={`flex-1 px-3 py-2.5 rounded-lg text-sm border transition-colors ${form.urgency===o.v ? `bg-${o.c}-600 text-white border-${o.c}-600` : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                      style={form.urgency===o.v ? {backgroundColor: o.c==='emerald'?'#059669':o.c==='amber'?'#D97706':'#DC2626', borderColor:'transparent', color:'#fff'} : {}}>
                      {o.v}
                    </button>
                  ))}
                </div>
              </Field>
            </div>
          </div>
        </Card>
      )}

      {step === 4 && (
        <Card title="ขั้นตอนที่ 5: หลักฐานและยืนยัน">
          <div className="space-y-4">
            <PhotoUploader value={form.photoUrl} onChange={v=>up('photoUrl',v)} label="รูปถ่ายระหว่างเยี่ยม (สภาพแผล / สภาพบ้าน)" />
            <Field label="แนบเอกสารเพิ่มเติม"><input type="file" multiple className="input py-2" /></Field>
            <Field label="หมายเหตุเพิ่มเติม"><textarea rows={2} value={form.note} onChange={e=>up('note',e.target.value)} className="input" /></Field>
            <label className="flex items-start gap-2.5 p-3 rounded-lg bg-slate-50 border border-slate-100 cursor-pointer">
              <input type="checkbox" checked={form.confirm} onChange={e=>up('confirm',e.target.checked)} className="w-4 h-4 mt-0.5 accent-teal-700" />
              <span className="text-sm text-slate-600">ข้าพเจ้าขอยืนยันว่าข้อมูลการเยี่ยมที่บันทึกข้างต้นถูกต้องตรงตามความเป็นจริงทุกประการ</span>
            </label>
            <div className="flex flex-wrap gap-2 pt-2">
              <Button variant="outline" icon="Save" onClick={()=>save(true)} disabled={saving}>บันทึกร่าง</Button>
              <Button icon="Send" onClick={()=>save(false)} disabled={saving}>{saving ? 'กำลังบันทึก...' : 'บันทึกและส่งให้ CM ตรวจสอบ'}</Button>
            </div>
          </div>
        </Card>
      )}

      {step < 4 && (
        <div className="flex justify-between gap-2">
          <Button variant="outline" icon="ChevronLeft" onClick={()=>setStep(s=>Math.max(s-1,0))} disabled={step===0}>ย้อนกลับ</Button>
          <Button onClick={next}>ถัดไป <Icon name="ChevronRight" className="w-4 h-4" /></Button>
        </div>
      )}

      <Card title="บันทึกการเยี่ยมล่าสุด" subtitle="ประวัติการเยี่ยมที่บันทึกเข้าระบบ">
        <DataTable columns={recentCols} data={[...visits].sort((a,b)=>String(b.date).localeCompare(String(a.date)))} pageSize={5} emptyMessage="ยังไม่มีบันทึกการเยี่ยมในระบบ" />
      </Card>
    </div>
  );
}

function Info({ label, value, danger }) {
  return <div><p className="text-[11px] text-slate-400">{label}</p><p className={`font-medium ${danger ? 'text-red-600' : 'text-slate-700'}`}>{value}</p></div>;
}

      {tab === 3 && (
        <Card title={`ปฏิทินภารกิจเยี่ยม เดือน${THAI_MONTHS[today.getMonth()]} ${today.getFullYear()+543}`} subtitle="วันที่ไฮไลต์คือวันที่มีกำหนดออกเยี่ยม">

              const day = i+1, has = taskDays.includes(day), isToday = day === today.getDate();
              return (
                <div key={day} className={`aspect-square flex flex-col items-center justify-center rounded-lg text-sm border ${isToday ? 'border-primary bg-teal-50 font-bold text-primary' : has ? 'border-amber-200 bg-amber-50 text-amber-700' : 'border-slate-100 text-slate-500'}`}>

                  {has && <span className="w-1.5 h-1.5 rounded-full bg-amber-500 mt-0.5" />}
                </div>
              );
            })}
          </div>
        </Card>
      )}
    </div>
  );
}

function ElderlyManagement() {
  const { elderly, loading } = useData();
  const { showToast } = useToast();
  const loc = useLocation();
  const [search, setSearch] = useState('');
  const [fVillage, setFVillage] = useState('');
  const [fGroup, setFGroup] = useState('');
  const [fAdl, setFAdl] = useState('');
  const [fCM, setFCM] = useState('');
  const [fCG, setFCG] = useState('');
  const [fStatus, setFStatus] = useState('');
  const [urgentOnly, setUrgentOnly] = useState(false);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState(emptyElderlyForm);
  const [saving, setSaving] = useState(false);

  useEffect(() => { if (new URLSearchParams(loc.search).get('action') === 'add') setModal(true); }, [loc.search]);

  const filtered = useMemo(() => elderly.filter(e => {
    if (search && !(e.name.includes(search) || String(e.hn).includes(search) || String(e.nationalId).includes(search))) return false;
    if (fVillage && e.village !== fVillage) return false;
    if (fGroup && e.group !== fGroup) return false;
    if (fAdl) { const n = Number(e.adl); if (fAdl==='0-4' && !(n<=4)) return false; if (fAdl==='5-11' && !(n>=5&&n<=11)) return false; if (fAdl==='12-20' && !(n>=12)) return false; }
    if (fCM && e.cm !== fCM) return false;
    if (fCG && e.cg !== fCG) return false;
    if (fStatus && e.visitStatus !== fStatus) return false;
    if (urgentOnly && e.urgency !== 'เร่งด่วน') return false;
    return true;
  }), [elderly, search, fVillage, fGroup, fAdl, fCM, fCG, fStatus, urgentOnly]);

  const up = (k,v) => setForm(f => ({...f,[k]:v}));

  const save = async () => {
    if (!form.name.trim()) return showToast('กรุณากรอกชื่อ-นามสกุลผู้สูงอายุ','error');
    if (!firebaseReady) return showToast('ยังไม่ได้เชื่อมต่อ Firebase — ไม่สามารถบันทึกได้','error');
    setSaving(true);
    try {
      await elderlyService.create({
        ...form, adl: form.adl, group: adlGroup(form.adl), type: adlGroup(form.adl),
        nationalId: maskNid(form.nid), visitStatus:'รอเยี่ยม', urgency:'ปกติ',
      });
      showToast('เพิ่มข้อมูลผู้สูงอายุเรียบร้อยแล้ว');
      setModal(false); setForm(emptyElderlyForm);
    } catch (err) { showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error'); }
    finally { setSaving(false); }
  };

  const exportCSV = () => {
    const rows = [['HN','ชื่อ-นามสกุล','อายุ','เพศ','หมู่บ้าน','ADL','กลุ่ม','โรคประจำตัว','แพ้ยา','CM','CG','เยี่ยมล่าสุด','สถานะ']];
    filtered.forEach(e => rows.push([e.hn,e.name,e.age,e.gender,e.village,e.adl,e.group,e.diseases,e.allergies,e.cm,e.cg,e.lastVisit,e.visitStatus]));
    downloadCSV('ทะเบียนผู้สูงอายุ_บ้านทับสอ.csv', rows);
    showToast('ส่งออกไฟล์ CSV เรียบร้อยแล้ว');
  };

  const cols = [
    { key:'hn', header:'HN' },
    { key:'name', header:'ชื่อ-นามสกุล', render:r => (
      <div className="flex items-center gap-2.5">
        {r.photoUrl ? <img src={r.photoUrl} className="w-8 h-8 rounded-full object-cover" /> : <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"><Icon name="User" className="w-4 h-4 text-slate-300" /></div>}
        <Link to={`/elderly/${r.id}`} className="font-medium text-slate-800 hover:text-primary">{r.name}</Link>
      </div>
    )},
    { key:'age', header:'อายุ', render:r=>`${r.age} ปี` },
    { key:'village', header:'หมู่บ้าน' },
    { key:'adl', header:'ADL', render:r => <span className="font-semibold text-primary">{r.adl}</span> },
    { key:'group', header:'กลุ่มผู้สูงอายุ', render:r => <StatusBadge label={r.group} /> },
    { key:'cg', header:'CG ผู้รับผิดชอบ' },
    { key:'lastVisit', header:'เยี่ยมล่าสุด' },
    { key:'visitStatus', header:'สถานะการนัดเยี่ยม', render:r => <StatusBadge label={r.visitStatus} /> },
    { key:'act', header:'', render:r => <Link to={`/elderly/${r.id}`}><Button size="sm" variant="outline" icon="Eye">รายละเอียด</Button></Link> },
  ];

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap justify-end gap-2">
        <Button variant="outline" icon="Download" onClick={exportCSV}>ส่งออก CSV</Button>
        <Button icon="UserPlus" onClick={()=>setModal(true)}>เพิ่มผู้สูงอายุ</Button>
      </div>

      <FilterBar searchValue={search} onSearchChange={setSearch} placeholder="ค้นหาชื่อ / HN / เลขบัตรประชาชน">
        <select value={fVillage} onChange={e=>setFVillage(e.target.value)} className="input w-auto min-w-[150px]"><option value="">ทุกหมู่บ้าน</option>{villages.map(v=><option key={v}>{v}</option>)}</select>
        <select value={fGroup} onChange={e=>setFGroup(e.target.value)} className="input w-auto min-w-[130px]"><option value="">ทุกกลุ่ม</option><option>ติดสังคม</option><option>ติดบ้าน</option><option>ติดเตียง</option></select>
        <select value={fAdl} onChange={e=>setFAdl(e.target.value)} className="input w-auto min-w-[140px]"><option value="">ทุกระดับ ADL</option><option value="0-4">ADL 0-4</option><option value="5-11">ADL 5-11</option><option value="12-20">ADL 12-20</option></select>
        <select value={fCM} onChange={e=>setFCM(e.target.value)} className="input w-auto min-w-[150px]"><option value="">ทุก CM</option>{mockCM.map(c=><option key={c.id}>{c.name}</option>)}</select>
        <select value={fCG} onChange={e=>setFCG(e.target.value)} className="input w-auto min-w-[150px]"><option value="">ทุก CG</option>{mockCG.map(c=><option key={c.id}>{c.name}</option>)}</select>
        <select value={fStatus} onChange={e=>setFStatus(e.target.value)} className="input w-auto min-w-[140px]"><option value="">ทุกสถานะ</option><option>เยี่ยมแล้ว</option><option>รอเยี่ยม</option><option>เกินกำหนด</option></select>
        <label className="flex items-center gap-2 text-sm text-slate-600 px-2 cursor-pointer">
          <input type="checkbox" checked={urgentOnly} onChange={e=>setUrgentOnly(e.target.checked)} className="w-4 h-4 accent-red-600" />
          <Icon name="TriangleAlert" className="w-4 h-4 text-red-500" /> เฉพาะเคสเร่งด่วน
        </label>
      </FilterBar>

      <DataTable columns={cols} data={filtered} loading={loading} pageSize={10} />

      <Modal open={modal} onClose={()=>setModal(false)} title="เพิ่มข้อมูลผู้สูงอายุ" size="lg"
        footer={<>
          <Button variant="outline" onClick={()=>setModal(false)}>ยกเลิก</Button>
          <Button icon="Save" onClick={save} disabled={saving}>{saving ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}</Button>
        </>}>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="เลขประจำตัวประชาชน"><input maxLength="13" value={form.nid} onChange={e=>up('nid',e.target.value)} placeholder="เลข 13 หลัก (ระบบจะปกปิดบางส่วน)" className="input" /></Field>
          <Field label="คำนำหน้า-ชื่อ-นามสกุล *"><input value={form.name} onChange={e=>up('name',e.target.value)} placeholder="เช่น นายบุญมี แสนสุข" className="input" /></Field>
          <Field label="อายุ (ปี)"><input type="number" value={form.age} onChange={e=>up('age',e.target.value)} className="input" /></Field>
          <Field label="เพศ"><select value={form.gender} onChange={e=>up('gender',e.target.value)} className="input"><option>ชาย</option><option>หญิง</option></select></Field>
          <Field label="หมู่บ้าน"><select value={form.village} onChange={e=>up('village',e.target.value)} className="input">{villages.map(v=><option key={v}>{v}</option>)}</select></Field>
          <Field label="คะแนน ADL (0-20)"><input type="number" min="0" max="20" value={form.adl} onChange={e=>up('adl',e.target.value)} className="input" />{form.adl!=='' && <p className="text-[11px] text-primary mt-1">จัดอยู่ในกลุ่ม: {adlGroup(form.adl)}</p>}</Field>
          <Field label="โรคประจำตัว"><input value={form.diseases} onChange={e=>up('diseases',e.target.value)} placeholder="เช่น เบาหวาน, ความดันโลหิตสูง" className="input" /></Field>
          <Field label="ประวัติแพ้ยา"><input value={form.allergies} onChange={e=>up('allergies',e.target.value)} className="input" /></Field>
          <Field label="CM ผู้รับผิดชอบ"><select value={form.cm} onChange={e=>up('cm',e.target.value)} className="input"><option value="">-- เลือก CM --</option>{mockCM.map(c=><option key={c.id}>{c.name}</option>)}</select></Field>
          <Field label="CG ผู้รับผิดชอบ"><select value={form.cg} onChange={e=>up('cg',e.target.value)} className="input"><option value="">-- เลือก CG --</option>{mockCG.map(c=><option key={c.id}>{c.name}</option>)}</select></Field>
          <Field label="ผู้ดูแลหลักในครอบครัว"><input value={form.caregiverName} onChange={e=>up('caregiverName',e.target.value)} className="input" /></Field>
          <Field label="เบอร์โทรติดต่อ"><input value={form.phone} onChange={e=>up('phone',e.target.value)} className="input" /></Field>
          <Field label="หมายเหตุ" className="sm:col-span-2"><textarea rows={2} value={form.note} onChange={e=>up('note',e.target.value)} className="input" /></Field>
          <div className="sm:col-span-2"><PhotoUploader value={form.photoUrl} onChange={v=>up('photoUrl',v)} label="รูปถ่ายผู้สูงอายุ / สภาพบ้าน" /></div>
        </div>
      </Modal>
    </div>
  );
}

        <Card title="แผนการดูแลต่อเนื่อง (Care Plan)">
          <div className="grid sm:grid-cols-2 gap-4 text-sm mb-4">
            <Info label="วันที่เยี่ยมล่าสุด" value={e.lastVisit} />
            <Info label="กำหนดเยี่ยมครั้งถัดไป" value={e.nextVisit} />
          </div>
          <div className="space-y-3">
            {history.slice(0,3).map(h => (
              <div key={h.id} className="p-3 rounded-xl border border-slate-100 bg-slate-50/60">
                <p className="text-xs text-slate-400">{toThaiDate(h.date)} · โดย {h.visitor}</p>
                <p className="text-sm text-slate-700 mt-1"><b>แผน:</b> {h.plan || '-'}</p>

          </div>

      )}
      {tab === 4 && (
        <Card title={`ประวัติการเยี่ยม (${history.length} ครั้ง)`} subtitle="เรียงจากครั้งล่าสุด">

            <div className="relative pl-6">
              <div className="absolute left-[7px] top-2 bottom-2 w-0.5 bg-slate-200" />

                    <div className="flex flex-wrap items-center gap-2">
                      <p className="text-sm font-semibold text-slate-800">{toThaiDate(h.date)}</p>
                      <StatusBadge label={h.visitType || 'เยี่ยมบ้าน'} type="info" />
                      <StatusBadge label={h.urgency || 'ปกติ'} />

                    <p className="text-xs text-slate-400 mt-0.5">ผู้เยี่ยม: {h.visitor || '-'} · ADL {h.adl || '-'} · BP {h.bp || '-'}</p>

                  </div>
                ))}
              </div>
            </div>
          )}
        </Card>
      )}
      {tab === 5 && (
        <Card title="วัสดุและอุปกรณ์ที่ได้รับ">
          <DataTable pageSize={5} data={mockEquipmentMoves.filter(m => m.receiver === e.name)} columns={[
            { key:'date', header:'วันที่' }, { key:'item', header:'รายการ' },
            { key:'action', header:'ประเภทรายการ', render:r => <StatusBadge label={r.action} type={r.action==='คืน'?'success':'info'} /> },
            { key:'qty', header:'จำนวน' }, { key:'by', header:'ผู้ดำเนินการ' },
          ]} emptyMessage="ยังไม่มีการเบิก/ยืมอุปกรณ์สำหรับผู้สูงอายุรายนี้" />
        </Card>
      )}
    </div>
  );
}

  const setF = (k,v) => setFilters(f => ({...f,[k]:v}));

  const runSearch = () => {
    setLoading(true);
    reportService.generate(selected.id, filters).then(() => {
      setTimeout(() => { setLoading(false); showToast('ประมวลผลรายงานเรียบร้อยแล้ว'); }, 500);
    });
  };

  const tableData = useMemo(() => {
    let d = elderly;
    if (filters.village) d = d.filter(e => e.village === filters.village);
    if (filters.cm) d = d.filter(e => e.cm === filters.cm);
    if (filters.cg) d = d.filter(e => e.cg === filters.cg);
    if (filters.status) d = d.filter(e => e.visitStatus === filters.status);
    if (selected.id === 'r5') d = d.filter(e => e.visitStatus === 'เกินกำหนด');
    if (selected.id === 'r6') d = d.filter(e => e.urgency !== 'ปกติ');
    return d;
  }, [elderly, filters, selected]);

  const staffChart = (selected.id === 'r3' ? mockCM : mockCG).map(s => ({ name:s.name.replace(/^(นาย|นาง|นางสาว)/,''), เป้าหมาย:s.elderlyCount, ผลงาน:s.visitsThisMonth }));
  const equipChart = mockEquipment.map(e => ({ name:e.name.length>12 ? e.name.slice(0,12)+'…' : e.name, คงเหลือ:e.qty, ขั้นต่ำ:e.minQty }));

  const exportFile = (type) => {
    if (type === 'excel') {
      const rows = [[selected.title],[`หน่วยบริการ: ${ORG.name}`],[],['HN','ชื่อ-นามสกุล','อายุ','หมู่บ้าน','ADL','กลุ่ม','CM','CG','เยี่ยมล่าสุด','สถานะ','ความเร่งด่วน']];
      tableData.forEach(e => rows.push([e.hn,e.name,e.age,e.village,e.adl,e.group,e.cm,e.cg,e.lastVisit,e.visitStatus,e.urgency]));
      downloadCSV(`${selected.title}.csv`, rows);
      showToast('ส่งออกไฟล์ Excel (CSV) เรียบร้อยแล้ว');
    } else { window.print(); }
  };

  const cols = selected.id === 'r7'
    ? [{key:'id',header:'รหัส'},{key:'name',header:'ชื่ออุปกรณ์'},{key:'type',header:'ประเภท'},{key:'qty',header:'คงเหลือ'},{key:'minQty',header:'ขั้นต่ำ'},{key:'status',header:'สถานะ',render:r=><StatusBadge label={r.status}/>}]
    : [
      { key:'hn', header:'HN' },
      { key:'name', header:'ชื่อ-นามสกุล', render:r => <Link to={`/elderly/${r.id}`} className="font-medium hover:text-primary">{r.name}</Link> },
      { key:'age', header:'อายุ', render:r=>`${r.age} ปี` },
      { key:'village', header:'หมู่บ้าน' },
      { key:'group', header:'กลุ่ม', render:r => <StatusBadge label={r.group} /> },
      { key:'cg', header:'CG' },
      { key:'lastVisit', header:'เยี่ยมล่าสุด' },
      { key:'visitStatus', header:'สถานะ', render:r => <StatusBadge label={r.visitStatus} /> },
    ];

  return (
    <div className="space-y-4">
      <Card title="ตัวกรองรายงาน" subtitle="เลือกช่วงเวลาและเงื่อนไขที่ต้องการประมวลผล">
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <Field label="ตั้งแต่วันที่"><input type="date" value={filters.from} onChange={e=>setF('from',e.target.value)} className="input" /></Field>
          <Field label="ถึงวันที่"><input type="date" value={filters.to} onChange={e=>setF('to',e.target.value)} className="input" /></Field>
          <Field label="หมู่บ้าน"><select value={filters.village} onChange={e=>setF('village',e.target.value)} className="input"><option value="">ทุกหมู่บ้าน</option>{villages.map(v=><option key={v}>{v}</option>)}</select></Field>
          <Field label="ระดับ ADL"><select value={filters.adl} onChange={e=>setF('adl',e.target.value)} className="input"><option value="">ทุกระดับ</option><option>0-4</option><option>5-11</option><option>12-20</option></select></Field>
          <Field label="Care Manager"><select value={filters.cm} onChange={e=>setF('cm',e.target.value)} className="input"><option value="">ทุก CM</option>{mockCM.map(c=><option key={c.id}>{c.name}</option>)}</select></Field>
          <Field label="Caregiver"><select value={filters.cg} onChange={e=>setF('cg',e.target.value)} className="input"><option value="">ทุก CG</option>{mockCG.map(c=><option key={c.id}>{c.name}</option>)}</select></Field>
          <Field label="สถานะการเยี่ยม"><select value={filters.status} onChange={e=>setF('status',e.target.value)} className="input"><option value="">ทุกสถานะ</option><option>เยี่ยมแล้ว</option><option>รอเยี่ยม</option><option>เกินกำหนด</option></select></Field>
          <div className="flex items-end gap-2 flex-wrap">
            <Button icon="Search" onClick={runSearch}>ค้นหารายงาน</Button>
          </div>
        </div>
        <div className="flex flex-wrap gap-2 mt-4 pt-4 border-t border-slate-100">
          <Button variant="outline" icon="Sheet" onClick={()=>exportFile('excel')}>Export Excel</Button>
          <Button variant="outline" icon="FileText" onClick={()=>exportFile('pdf')}>Export PDF</Button>
        </div>
      </Card>

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
        {reportTypes.map(r => (
          <button key={r.id} onClick={()=>setSelected(r)}
            className={`text-left p-4 rounded-xl border flex items-start gap-3 transition-all ${selected.id===r.id ? 'border-primary bg-teal-50 ring-2 ring-primary/20' : 'border-slate-100 bg-white hover:border-primary/40 shadow-sm'}`}>
            <Icon name={r.icon} className={`w-5 h-5 shrink-0 mt-0.5 ${selected.id===r.id ? 'text-primary' : 'text-slate-400'}`} />
            <span className={`text-sm font-medium ${selected.id===r.id ? 'text-primary' : 'text-slate-700'}`}>{r.title}</span>
          </button>
        ))}
      </div>

      <Card title={selected.title} subtitle={`ข้อมูล ณ วันที่ ${toThaiDate(new Date())} · ${ORG.name}`}>
        <div style={{width:'100%', height:300}}>
          <ResponsiveContainer>
            {selected.chart === 'pie' ? (
              <PieChart>
                <Pie data={pieData} dataKey="value" nameKey="name" innerRadius={65} outerRadius={100} paddingAngle={3}>
                  {pieData.map((e,i)=><Cell key={i} fill={e.color} />)}
                </Pie>
                <Tooltip formatter={(v,n)=>[`${v} คน`,n]} contentStyle={{borderRadius:12,fontSize:12}} /><Legend wrapperStyle={{fontSize:12}} />
              </PieChart>
            ) : selected.chart === 'staff' ? (
              <BarChart data={staffChart} margin={{top:10,right:10,left:-20,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0" />
                <XAxis dataKey="name" tick={{fontSize:10, fill:'#64748B'}} axisLine={false} tickLine={false} />
                <YAxis tick={{fontSize:11, fill:'#64748B'}} axisLine={false} tickLine={false} />
                <Tooltip contentStyle={{borderRadius:12,fontSize:12}} /><Legend wrapperStyle={{fontSize:12}} />
                <Bar dataKey="เป้าหมาย" fill="#2563EB" radius={[6,6,0,0]} maxBarSize={26} />
                <Bar dataKey="ผลงาน" fill="#0F766E" radius={[6,6,0,0]} maxBarSize={26} />
              </BarChart>
            ) : selected.chart === 'equipment' ? (
              <BarChart data={equipChart} margin={{top:10,right:10,left:-20,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0" />
                <XAxis dataKey="name" tick={{fontSize:9, fill:'#64748B'}} axisLine={false} tickLine={false} />
                <YAxis tick={{fontSize:11, fill:'#64748B'}} axisLine={false} tickLine={false} />
                <Tooltip contentStyle={{borderRadius:12,fontSize:12}} /><Legend wrapperStyle={{fontSize:12}} />
                <Bar dataKey="คงเหลือ" fill="#0F766E" radius={[6,6,0,0]} maxBarSize={26} />
                <Bar dataKey="ขั้นต่ำ" fill="#F59E0B" radius={[6,6,0,0]} maxBarSize={26} />
              </BarChart>
            ) : (
              <BarChart data={monthlyVisitChart} margin={{top:10,right:10,left:-20,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0" />
                <XAxis dataKey="month" tick={{fontSize:11, fill:'#64748B'}} axisLine={false} tickLine={false} />
                <YAxis tick={{fontSize:11, fill:'#64748B'}} axisLine={false} tickLine={false} />
                <Tooltip contentStyle={{borderRadius:12,fontSize:12}} /><Legend wrapperStyle={{fontSize:12}} />
                <Bar dataKey="เป้าหมาย" fill="#2563EB" radius={[6,6,0,0]} maxBarSize={28} />
                <Bar dataKey="เยี่ยมจริง" fill="#0F766E" radius={[6,6,0,0]} maxBarSize={28} />
              </BarChart>
            )}
          </ResponsiveContainer>
        </div>
      </Card>

      <Card title="ตารางรายละเอียด" action={<Button size="sm" variant="outline" icon="Download" onClick={()=>exportFile('excel')}>ดาวน์โหลดรายงาน</Button>}>
        <DataTable columns={cols} data={selected.id==='r7' ? mockEquipment : tableData} loading={loading} pageSize={8} />
      </Card>
    </div>
  );
}

   pages/EquipmentManagement.jsx
   ========================================================================= */
function EquipmentManagement() {
  const { elderly } = useData();
  const { showToast } = useToast();
  const [items, setItems] = useState([]);
  const [moves, setMoves] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // 'borrow' | 'add' | 'history'
  const [borrowForm, setBorrowForm] = useState({ elderly:'', item:'', qty:1, date:new Date().toISOString().slice(0,10), by:'', note:'', action:'ยืม' });

  useEffect(() => {
    Promise.all([equipmentService.getAll(), equipmentService.getMoves()]).then(([a,b]) => { setItems(a); setMoves(b); setLoading(false); });
  }, []);

  const stats = useMemo(() => ({
    total: items.reduce((s,i)=>s+i.qty,0),
    available: items.filter(i=>i.status==='พร้อมใช้งาน').reduce((s,i)=>s+i.qty,0),
    borrowed: items.filter(i=>i.status==='กำลังถูกยืม').reduce((s,i)=>s+i.qty,0),
    repair: items.filter(i=>i.status==='รอซ่อม').reduce((s,i)=>s+i.qty,0),
    low: items.filter(i=>i.qty <= i.minQty).length,
  }), [items]);

  const filtered = items.filter(i => !search || i.name.includes(search) || i.id.includes(search) || i.type.includes(search));
  const bf = (k,v) => setBorrowForm(f => ({...f,[k]:v}));

  const submitBorrow = async () => {
    if (!borrowForm.elderly || !borrowForm.item) return showToast('กรุณาเลือกผู้สูงอายุและรายการอุปกรณ์','error');
    await equipmentService.borrow(borrowForm);
    setMoves(m => [{ id:'mv'+Date.now(), date:toThaiDate(borrowForm.date), item:borrowForm.item, action:borrowForm.action, qty:borrowForm.qty, receiver:borrowForm.elderly, by:borrowForm.by||'เจ้าหน้าที่ รพ.สต.' }, ...m]);
    showToast(`บันทึกการ${borrowForm.action}อุปกรณ์เรียบร้อยแล้ว`);
    setModal(null);
  };

  const cols = [
    { key:'id', header:'รหัสอุปกรณ์' },
    { key:'name', header:'ชื่ออุปกรณ์', render:r => <span className="font-medium text-slate-800">{r.name}</span> },
    { key:'type', header:'ประเภท' },
    { key:'qty', header:'คงเหลือ', render:r => <span className={r.qty<=r.minQty ? 'text-red-600 font-semibold' : 'font-semibold text-slate-700'}>{r.qty}</span> },
    { key:'minQty', header:'ขั้นต่ำ' },
    { key:'status', header:'สถานะ', render:r => <StatusBadge label={r.status} /> },
    { key:'location', header:'สถานที่จัดเก็บ' },
    { key:'act', header:'จัดการ', render:r => (
      <div className="flex flex-wrap gap-1">
        <Button size="sm" variant="soft" onClick={()=>{bf('item',r.name); bf('action','ยืม'); setModal('borrow');}}>เบิก/ยืม</Button>
        <Button size="sm" variant="outline" onClick={()=>{bf('item',r.name); bf('action','คืน'); setModal('borrow');}}>คืน</Button>
        <Button size="sm" variant="ghost" icon="Wrench" onClick={()=>showToast(`ส่งซ่อม "${r.name}" เรียบร้อยแล้ว`,'info')} />
      </div>
    )},
  ];

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap justify-end gap-2">
        <Button variant="outline" icon="History" onClick={()=>setModal('history')}>ประวัติการเคลื่อนไหว</Button>
        <Button variant="secondary" icon="PackagePlus" onClick={()=>showToast('บันทึกการรับเข้าคลังเรียบร้อยแล้ว','success')}>รับเข้าคลัง</Button>
        <Button icon="Plus" onClick={()=>showToast('ฟังก์ชันเพิ่มวัสดุอยู่ระหว่างพัฒนา','info')}>เพิ่มวัสดุ/อุปกรณ์</Button>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <StatCard icon="Package" label="อุปกรณ์ทั้งหมด" value={`${stats.total} ชิ้น`} color="teal" />
        <StatCard icon="PackageCheck" label="พร้อมใช้งาน" value={`${stats.available} ชิ้น`} color="green" />
        <StatCard icon="PackageOpen" label="กำลังถูกยืม" value={`${stats.borrowed} ชิ้น`} color="blue" />
        <StatCard icon="Wrench" label="รอซ่อม" value={`${stats.repair} ชิ้น`} color="red" />
        <StatCard icon="TriangleAlert" label="ใกล้หมด" value={`${stats.low} รายการ`} color="amber" />
      </div>

      <FilterBar searchValue={search} onSearchChange={setSearch} placeholder="ค้นหารหัส, ชื่ออุปกรณ์ หรือประเภท" />
      <DataTable columns={cols} data={filtered} loading={loading} />

      <Modal open={modal==='borrow'} onClose={()=>setModal(null)} title={`บันทึกการ${borrowForm.action}อุปกรณ์`}
        footer={<><Button variant="outline" onClick={()=>setModal(null)}>ยกเลิก</Button><Button icon="Save" onClick={submitBorrow}>บันทึก</Button></>}>
        <div className="space-y-4">
          <Field label="ผู้สูงอายุผู้รับอุปกรณ์ *">
            <select value={borrowForm.elderly} onChange={e=>bf('elderly',e.target.value)} className="input">
              <option value="">-- เลือกผู้สูงอายุ --</option>
              {elderly.map(e => <option key={e.id} value={e.name}>{e.name} ({e.village})</option>)}
            </select>
          </Field>
          <Field label="รายการอุปกรณ์ *">
            <select value={borrowForm.item} onChange={e=>bf('item',e.target.value)} className="input">
              <option value="">-- เลือกอุปกรณ์ --</option>
              {items.map(i => <option key={i.id} value={i.name}>{i.name} (คงเหลือ {i.qty})</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="จำนวน"><input type="number" min="1" value={borrowForm.qty} onChange={e=>bf('qty',e.target.value)} className="input" /></Field>
            <Field label="วันที่ส่งมอบ"><input type="date" value={borrowForm.date} onChange={e=>bf('date',e.target.value)} className="input" /></Field>
          </div>
          <Field label="ผู้ดำเนินการ"><input value={borrowForm.by} onChange={e=>bf('by',e.target.value)} placeholder="ชื่อเจ้าหน้าที่ผู้ส่งมอบ" className="input" /></Field>
          <Field label="หมายเหตุ"><textarea rows={2} value={borrowForm.note} onChange={e=>bf('note',e.target.value)} className="input" /></Field>
        </div>
      </Modal>

      <Modal open={modal==='history'} onClose={()=>setModal(null)} title="ประวัติการเคลื่อนไหวของวัสดุอุปกรณ์" size="lg">
        <DataTable pageSize={8} data={moves} columns={[
          { key:'date', header:'วันที่' }, { key:'item', header:'รายการ' },
          { key:'action', header:'ประเภท', render:r => <StatusBadge label={r.action} type={r.action==='คืน'?'success':r.action==='ส่งซ่อม'?'danger':'info'} /> },
          { key:'qty', header:'จำนวน' }, { key:'receiver', header:'ผู้รับ' }, { key:'by', header:'ผู้ดำเนินการ' },
        ]} />
      </Modal>
    </div>
  );
}

const emptyUser = { name:'', username:'', email:'', phone:'', role:ROLES[3], area:'', status:'ใช้งาน' };

function UserManagement() {
  const { showToast } = useToast();
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [fRole, setFRole] = useState('');
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState(emptyUser);

  useEffect(() => { userService.getAll().then(d => { setUsers(d); setLoading(false); }); }, []);
  const up = (k,v) => setForm(f => ({...f,[k]:v}));

  const filtered = users.filter(u => (!search || u.name.includes(search) || u.username.includes(search)) && (!fRole || u.role === fRole));

  const save = async () => {
    if (!form.name || !form.username) return showToast('กรุณากรอกชื่อ-นามสกุลและ Username','error');
    await userService.save(form);
    setUsers(u => form.id ? u.map(x => x.id===form.id ? form : x) : [...u, {...form, id:'u'+Date.now(), lastLogin:'ยังไม่เคยเข้าใช้'}]);
    showToast(form.id ? 'แก้ไขข้อมูลผู้ใช้งานเรียบร้อยแล้ว' : 'เพิ่มผู้ใช้งานเรียบร้อยแล้ว');
    setModal(false); setForm(emptyUser);
  };

  const toggleStatus = (u) => {
    setUsers(list => list.map(x => x.id===u.id ? {...x, status: x.status==='ใช้งาน' ? 'ระงับการใช้งาน' : 'ใช้งาน'} : x));
    showToast(u.status==='ใช้งาน' ? `ระงับบัญชี ${u.name} แล้ว` : `เปิดใช้งานบัญชี ${u.name} แล้ว`, 'warning');
  };

  const cols = [
    { key:'name', header:'ชื่อ-นามสกุล', render:r => (
      <div className="flex items-center gap-2.5">
        <div className="w-8 h-8 rounded-full bg-teal-100 text-primary flex items-center justify-center text-xs font-semibold">{r.name.replace(/^(นาย|นาง|นางสาว)/,'')[0]}</div>
        <div><p className="font-medium text-slate-800">{r.name}</p><p className="text-[11px] text-slate-400">{r.email}</p></div>
      </div>
    )},
    { key:'username', header:'Username' },
    { key:'role', header:'บทบาท', render:r => <StatusBadge label={r.role} type={r.role==='ผู้ดูแลระบบ'?'teal':'info'} /> },
    { key:'area', header:'หน่วยงาน/พื้นที่' },
    { key:'lastLogin', header:'เข้าใช้ล่าสุด' },
    { key:'status', header:'สถานะบัญชี', render:r => <StatusBadge label={r.status} /> },
    { key:'act', header:'จัดการ', render:r => (
      <div className="flex gap-1">
        <Button size="sm" variant="ghost" icon="Pencil" onClick={()=>{setForm(r); setModal(true);}} />
        <Button size="sm" variant="ghost" icon={r.status==='ใช้งาน'?'Lock':'LockOpen'} className="text-amber-500" onClick={()=>toggleStatus(r)} />
        <Button size="sm" variant="ghost" icon="KeyRound" className="text-blue-500" onClick={()=>showToast(`ส่งลิงก์รีเซ็ตรหัสผ่านไปยัง ${r.email} แล้ว`,'info')} />
      </div>
    )},
  ];

  return (
    <div className="space-y-4">
      <div className="flex justify-end"><Button icon="UserPlus" onClick={()=>{setForm(emptyUser); setModal(true);}}>เพิ่มผู้ใช้งาน</Button></div>
      <FilterBar searchValue={search} onSearchChange={setSearch} placeholder="ค้นหาชื่อหรือ Username">
        <select value={fRole} onChange={e=>setFRole(e.target.value)} className="input w-auto min-w-[180px]">
          <option value="">ทุกบทบาท</option>{ROLES.map(r=><option key={r}>{r}</option>)}
        </select>
      </FilterBar>
      <DataTable columns={cols} data={filtered} loading={loading} />

      <Modal open={modal} onClose={()=>setModal(false)} title={form.id ? 'แก้ไขข้อมูลผู้ใช้งาน' : 'เพิ่มผู้ใช้งานใหม่'}
        footer={<><Button variant="outline" onClick={()=>setModal(false)}>ยกเลิก</Button><Button icon="Save" onClick={save}>บันทึก</Button></>}>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="ชื่อ-นามสกุล *"><input value={form.name} onChange={e=>up('name',e.target.value)} className="input" /></Field>
          <Field label="Username *"><input value={form.username} onChange={e=>up('username',e.target.value)} className="input" /></Field>
          <Field label="อีเมล"><input type="email" value={form.email} onChange={e=>up('email',e.target.value)} className="input" /></Field>
          <Field label="เบอร์โทรศัพท์"><input value={form.phone} onChange={e=>up('phone',e.target.value)} className="input" /></Field>
          <Field label="บทบาท"><select value={form.role} onChange={e=>up('role',e.target.value)} className="input">{ROLES.map(r=><option key={r}>{r}</option>)}</select></Field>
          <Field label="พื้นที่รับผิดชอบ"><input value={form.area} onChange={e=>up('area',e.target.value)} placeholder="เช่น หมู่ 1-2 หรือ รพ.สต.บ้านทับสอ" className="input" /></Field>
          <Field label="สถานะบัญชี" className="sm:col-span-2"><select value={form.status} onChange={e=>up('status',e.target.value)} className="input"><option>ใช้งาน</option><option>ระงับการใช้งาน</option></select></Field>
        </div>
      </Modal>
    </div>
  );
}

          <Field label="ที่ตั้ง"><input defaultValue={ORG.area} className="input" /></Field>
          <Field label="รหัสหน่วยบริการ (HCODE)"><input defaultValue="05446" className="input" /></Field>
          <Field label="เบอร์โทรศัพท์"><input defaultValue="042-xxx-xxx" className="input" /></Field>

        <div className="mt-4"><Button icon="Save" onClick={()=>showToast('บันทึกการตั้งค่าเรียบร้อยแล้ว')}>บันทึกการตั้งค่า</Button></div>
      </Card>

      <Card title="สถานะการเชื่อมต่อระบบ">
        <div className="space-y-3 text-sm">
          <Row label="Firebase Firestore" ok={source==='firestore'} detail={source==='firestore' ? `เชื่อมต่อแล้ว (โปรเจกต์ ${firebaseConfig.projectId})` : 'ยังไม่ได้เชื่อมต่อ — กรุณาตรวจสอบ apiKey และเปิดใช้ Firestore'} />
          <Row label="ImgBB (จัดเก็บรูปภาพ)" ok={!!IMGBB_API_KEY} detail={IMGBB_API_KEY ? 'พร้อมใช้งาน' : 'ยังไม่ได้ตั้งค่า API Key'} />
          <Row label="REST API Backend" ok={false} detail="ยังไม่เชื่อมต่อ — เตรียมโครงสร้าง service layer ไว้แล้วใน services/api.js" />
        </div>
      </Card>

      <Card title="การแจ้งเตือน">
        <div className="space-y-3">
          {['แจ้งเตือนเมื่อมีผู้สูงอายุเกินกำหนดเยี่ยม','แจ้งเตือนเคสเร่งด่วนให้ CM ทันที','แจ้งเตือนเมื่อวัสดุอุปกรณ์ใกล้หมด','สรุปผลงานรายสัปดาห์ทางอีเมล'].map((t,i) => (
            <label key={t} className="flex items-center justify-between gap-3 p-3 rounded-lg border border-slate-100 hover:bg-slate-50 cursor-pointer">
              <span className="text-sm text-slate-600">{t}</span>
              <input type="checkbox" defaultChecked={i<3} className="w-4 h-4 accent-teal-700" />
            </label>
          ))}
        </div>
      </Card>
    </div>
  );
}

function Row({ label, ok, detail }) {
  return (
    <div className="flex items-start gap-3 p-3 rounded-lg border border-slate-100">
      <span className={`w-2.5 h-2.5 rounded-full mt-1.5 shrink-0 ${ok ? 'bg-emerald-500' : 'bg-slate-300'}`} />
      <div><p className="font-medium text-slate-700">{label}</p><p className="text-xs text-slate-400">{detail}</p></div>
    </div>
  );
}

/* =========================================================================

function App() {
  return (
    <Routes>
      <Route element={<MainLayout />}>
        <Route path="/" element={<Navigate to="/dashboard" replace />} />
        <Route path="/dashboard" element={<Dashboard />} />
        <Route path="/visits" element={<VisitRecord />} />
        <Route path="/staff" element={<StaffManagement />} />
        <Route path="/staff/:id" element={<StaffDetail />} />
        <Route path="/elderly" element={<ElderlyManagement />} />
        <Route path="/elderly/:id" element={<ElderlyDetail />} />
        <Route path="/reports" element={<Reports />} />
        <Route path="/equipment" element={<EquipmentManagement />} />
        <Route path="/users" element={<UserManagement />} />
        <Route path="/settings" element={<Settings />} />
        <Route path="*" element={<Card><p className="text-center text-slate-400 py-10">ไม่พบหน้าที่คุณค้นหา</p></Card>} />
      </Route>

  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <HashRouter>
    <ToastProvider>

);
